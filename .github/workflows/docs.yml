name: Docs

# The documentation site (docs/, built with Astro Starlight), published to GitHub Pages at
# https://anthonypluth.github.io/Runway/. A pull request that changes it only builds it, which also checks every link
# between pages (starlight-links-validator); a push to main builds and publishes it. The build and the deploy are fleet's
# reusable workflow (AnthonyPluth/fleet, .github/workflows/docs.yml) at the commit pinned below: `make docs-build`, then
# the Pages upload and deploy on main only. The triggers with their path filters, the name the merge gate lists and the
# concurrency group stay here. The job grants all three permissions the called workflow's jobs need: a called workflow
# can't be given more than its caller has (on a pull request the deploy job is skipped). The effective permissions are
# the job-level ones in fleet's docs.yml at the pinned commit: `build` (line 78) `contents: read`; `deploy` (line 126)
# `pages: write` + `id-token: write`, in the `github-pages` environment (line 129), with `if` (line 123) main and not a
# pull request; the workflow's own top-level `permissions: {}` (line 67). A narrower grant here fails the run at startup
# (tried: `contents: read` alone is a startup_failure). The check runs are named `docs / build` and `docs / deploy`.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions" once.
on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/docs.yml]
  pull_request:
    branches: [main]
    paths: [docs/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step (without it, only
# the last command in a pipeline counts, and a failed gh or curl passes silently).
defaults:
  run:
    shell: bash

jobs:
  docs:
    permissions:
      contents: read
      pages: write      # publish the site
      id-token: write   # prove to Pages the artifact came from this workflow
    uses: AnthonyPluth/fleet/.github/workflows/docs.yml@b9f64fa5fd2859c87eabbbcda7b62e02b3dd0764   # v3.0.0
