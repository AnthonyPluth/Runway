name: Deep scan due

# Once a quarter, fleet's reusable workflow (AnthonyPluth/fleet, .github/workflows/deep-scan-due.yml) at the commit
# pinned below opens one "Deep security scan due" issue (labels `manual`, `security`), unless one is open, with the link
# to fleet's deep-scan runbook, the revision of the last scan and the number of commits since. The scan itself is run by
# a person (the claude-security plugin asks a confirmation only the person's own request can answer), so a workflow can
# only remind. It needs `issues: write` and `contents: read` (the called job asks for both, and a called job can't
# have more than its caller grants), and no secrets.
on:
  schedule:
    - cron: "17 7 3 1,4,7,10 *"   # quarterly
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  remind:
    permissions:
      contents: read   # count the commits since the last scan
      issues: write    # read the earlier issues and open the reminder
    uses: AnthonyPluth/fleet/.github/workflows/deep-scan-due.yml@c5cafc050fda88714f1cb1fb1129487ef0f2b117   # v2.0.0
