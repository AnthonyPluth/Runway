name: Cancel runs on close

# When a pull request is merged or closed, stop its runs that are still going: the Docker image build and tests, the
# security scans and the verify flows. Nothing is lost, since a merge starts main's own runs.
#
# GitHub doesn't cancel a pull request's runs when it closes. Each of those workflows is in a concurrency group per pull
# request with cancel-in-progress, which is how a new push already replaces an older run. fleet's reusable workflow
# (AnthonyPluth/fleet, .github/workflows/cancel-on-close.yml), pinned by commit below, joins each of the groups listed
# (the names must match the workflows'; `{0}` is the pull request's number), so starting it cancels the run in progress;
# the job itself does nothing and needs no permission. The groups are built from the pull request's number, never from
# github.ref: once a pull request is merged, github.ref on its closed event is main's, and joining main's groups would
# cancel main's own release and scans. GitHub's own CodeQL checks come from the repository's settings, not a workflow
# here, so they aren't covered.
on:
  pull_request:
    types: [closed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  cancel:
    uses: AnthonyPluth/fleet/.github/workflows/cancel-on-close.yml@77f776706ed977c3e5732b036bbf6a821c62d860   # v2.2.1
    with:
      groups: '["docker-image-refs/pull/{0}/merge", "security-refs/pull/{0}/merge", "verify-{0}"]'   # docker.yml, security.yml, verify.yml
