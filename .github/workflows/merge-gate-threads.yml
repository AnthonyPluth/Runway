name: Merge gate (threads)

# A new review or review comment (a reviewer's P1 can land after the other checks went green) starts no workflow the
# merge gate listens to, so this one asks for the gate to decide the pull request again (fleet's merge-gate.sh fails it
# while a thread with a P1 or P2 badge from Codex is open). fleet's reusable workflow, pinned by commit below, runs
# main's merge-gate.yml with the pull request's number, as agent-review.yml does, and does nothing else: it checks out
# nothing and runs nothing of the pull request's.
#
# Resolving a thread is not an event GitHub Actions can start a workflow on (GitHub sends a webhook for it, which Actions
# can't subscribe to; a workflow that names it is invalid and never runs, which is what happened to this file until
# 2026-11-02), so after resolving the last open P1 or P2 thread, run the gate again by hand (Actions → Merge gate → Run
# workflow with the pull request's number) or push; the next review comment does it too.
#
# A pull request from a fork gets a read-only token here, so the request is skipped for it: its gate looks again on the
# next push or check, or by hand.
#
# merge-gate.yml sets `require-codex-review: true`, so the gate waits for Codex's review of the head commit, and a Codex
# review that finds nothing arrives as a conversation comment, which neither review trigger sees. The `codex-comment`
# job runs the gate again on Codex's own comments on a pull request only (fleet's docs/adopting.md, "Open review
# threads"). A comment's workflow runs with the base repository's token, so there is no fork to skip there.
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:   # zizmor: ignore[dangerous-triggers] only Codex's own comment on a pull request starts a job, which checks out nothing and passes main's merge gate only the number
    types: [created, edited]

permissions: {}

defaults:
  run:
    shell: bash

# This caller has no concurrency group, neither the workflow's nor a job's (fleet's docs/adopting.md). Codex posts a
# review and a comment per finding in one burst, all for the same head commit: with a group and `cancel-in-progress`,
# each newer run cancelled the one before it, and a cancelled job leaves a check run on the pull request's head that
# GitHub lists as failing (Merge gate green, the checks red). Cancelling saves nothing, since each run only starts the
# gate, and merge-gate.yml's own group (`merge-gate-<pull request number>` for a `workflow_dispatch`, with
# `cancel-in-progress`) already replaces an older evaluation of the same pull request with the newer one. A
# workflow-level group would also be wrong: it is joined before any job's `if:` is read, and `issue_comment` fires on
# every comment on the pull request, so someone's comment (whose run does nothing) would cancel a gate restart still in
# flight and the gate wouldn't look again.
jobs:
  decide:
    if: github.event_name != 'issue_comment' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write   # start main's merge-gate.yml
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate-threads.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0
    with:
      pr: ${{ github.event.pull_request.number }}
  codex-comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    permissions:
      actions: write   # start main's merge-gate.yml
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate-threads.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0
    with:
      pr: ${{ github.event.issue.number }}
