name: Merge gate (threads)

# Resolving or reopening a review thread starts no workflow the merge gate listens to, so this one asks for the gate
# to decide the pull request again (.github/scripts/merge-gate.sh fails it while a thread with a P1 or P2 badge is
# open). It runs main's copy of merge-gate.yml, as agent-review.yml does, and does nothing else.
#
# A pull request from a fork gets a read-only token here, so the request is skipped for it: its gate looks again on the
# next push or check, or by hand (Actions → Merge gate → Run workflow).

on:
  pull_request_review_thread:
    types: [resolved, unresolved]

permissions:
  actions: write   # start main's merge-gate.yml

defaults:
  run:
    shell: bash

concurrency:
  group: merge-gate-threads-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the merge gate to decide again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh workflow run merge-gate.yml --repo "$REPO" --ref main -f pr="$PR"
