name: Verify flows

# Runs `make verify-flows` in a real browser against the demo server, through fleet's reusable workflow
# (AnthonyPluth/fleet, .github/workflows/verify.yml) at the commit pinned below: `make verify`'s pages and scripted flows
# (frontend/verify/flows/*.json), so a change to the web app that moves a button, a label or the Tab order fails here
# instead of leaving a flow broken on main (the budget-rollover-menu flow did), then tools/control end to end
# (frontend/verify/control-smoke.mjs). fleet's workflow sets up Python 3.14 with Poetry (the main dependencies only),
# Node from .nvmrc with the web app's packages, Chromium and libfaketime (the frozen clock), then runs the one target.
# Only a change that can reach a flow runs it: the web app, the demo data, the verify runner or this file. A pull
# request without one has no run at all, which the merge gate treats as nothing to wait for. A push to main runs it too,
# for two pull requests that each pass alone and break a flow together.
# It sends nothing out and needs no secret: the demo server is made-up data on the loopback address.
# The triggers with their path filters, the concurrency group and the job's name (the status the merge gate lists) stay
# here, because a called workflow can't declare them.
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - runway/domain/demo.py
      - runway/verify.py
      - .github/workflows/verify.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - runway/domain/demo.py
      - runway/verify.py
      - .github/workflows/verify.yml
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# A newer push replaces a pull request's run that's still going; on main, runs queue rather than cut one off. Built from
# the pull request's number, so cancel-on-close.yml can join the group when it closes.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flows:
    name: Verify flows
    permissions:
      contents: read
    uses: AnthonyPluth/fleet/.github/workflows/verify.yml@b9f64fa5fd2859c87eabbbcda7b62e02b3dd0764   # v3.0.0
    with:
      make-target: verify-flows
      poetry-install-args: --only main
