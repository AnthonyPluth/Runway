name: Verify flows

# Runs `make verify`'s scripted flows (frontend/verify/flows/*.json) in a real browser against the demo server, so a change
# to the web app that moves a button, a label or the Tab order fails here instead of leaving a flow broken on main (the
# budget-rollover-menu flow did). Only a change that can reach a flow runs it: the web app, the demo data, the verify
# runner or this file. A pull request without one has no run at all, which the merge gate treats as nothing to wait for.
# It also fails when the committed screenshots/ differ from the images that same run writes (tools/sync_screenshots.py
# --check), so a pull request that changes the UI without `make screenshots`, or leaves a diff on a page it didn't touch,
# is caught; a change to screenshots/ alone runs it too. The merge gate already waits on this workflow's result.
# A push to main runs it too, for two pull requests that each pass alone and break a flow together.
# It sends nothing out and needs no secret: the demo server is made-up data on the loopback address.
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - screenshots/**
      - tools/sync_screenshots.py
      - runway/domain/demo.py
      - runway/verify.py
      - .github/workflows/verify.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - screenshots/**
      - tools/sync_screenshots.py
      - runway/domain/demo.py
      - runway/verify.py
      - .github/workflows/verify.yml
  workflow_dispatch:

permissions:
  contents: read

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step (without it, only
# the last command in a pipeline counts, and a failed gh or curl passes silently).
defaults:
  run:
    shell: bash

# A newer push replaces a pull request's run that's still going; on main, runs queue rather than cut one off. Built from
# the pull request's number, so cancel-on-close.yml can join the group when it closes.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-poetry   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
        with:
          cache-name: verify
          install-args: --only main
      - uses: ./.github/actions/setup-node-app   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
        with:
          directory: frontend
      # The runner has no Chromium where verify.mjs looks (PLAYWRIGHT_BROWSERS_PATH), so take the one the locked
      # @playwright/test version is built for.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # make verify freezes the clock of the demo server and its seed with libfaketime (runway/verify.py), so the images
      # only change when the UI or its data does.
      - name: Install libfaketime
        run: sudo apt-get update -q && sudo apt-get install -yq libfaketime
      - name: Build the web app
        working-directory: frontend
        run: npm run build
      # Exits non-zero on a failed step (a selector that matches nothing, a focus that never arrives), a console error or a
      # 5xx, and prints each as a FAIL line naming the flow and the width.
      - name: Run the pages and flows
        run: poetry run python run.py verify
      # The committed screenshots/ are the baselines, so they must be what this very run writes, byte for byte (the clock
      # is frozen, so they are). Reuses the run above rather than a second `make verify`; changes nothing. On a mismatch
      # it lists the files and says to run `make screenshots` and commit.
      - name: Check screenshots/ is what make verify writes
        id: screenshots
        run: poetry run python tools/sync_screenshots.py --check --out "$RUNNER_TEMP/screenshots-check"
      # On a mismatch only: the list and this run's whole set of images, to compare with or take from by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: ${{ failure() && steps.screenshots.outcome == 'failure' }}
        with:
          name: screenshots-regenerated
          path: ${{ runner.temp }}/screenshots-check
          retention-days: 14
          if-no-files-found: warn
      # tools/control (the session agents drive the app with) end to end on the same demo data and frozen clock: doctor,
      # start, snapshot, screenshot, a flow, reset, stop, and nothing left running (frontend/verify/control-smoke.mjs).
      - name: Drive the app with tools/control
        if: ${{ !cancelled() }}
        run: RUNWAY_PYTHON="$(poetry run python -c 'import sys; print(sys.executable)')" node frontend/verify/control-smoke.mjs
