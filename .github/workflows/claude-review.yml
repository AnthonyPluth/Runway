name: Claude review

# An AI code review on each pull request: Claude reads the diff with the repository's own rules (AGENTS.md, CLAUDE.md,
# SECURITY.md) and leaves inline comments on what it finds, plus one summary comment that each later review of the same
# pull request edits. It only reads and comments: it can't push, approve or merge, and a person still decides.
#
# It runs when the repository has one of these secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY        an Anthropic API key, billed per review
#   CLAUDE_CODE_OAUTH_TOKEN  a Claude Pro or Max subscription instead (make one with `claude setup-token`)
# Without either it skips. Pull requests from forks never see the secrets, so they skip too; so do drafts and
# Dependabot's updates (the Docker workflow already tests those).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the pull request replaces a review still running on the old one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot's pull requests skip by their author, not by who pushed last (as dependabot-merge.yml checks).
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write     # the review comments
      id-token: write          # the action asks for it even when it posts with GITHUB_TOKEN
    steps:
      - name: Check for a Claude credential
        id: auth
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ready=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != true ]; then echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret, so no review."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        if: steps.auth.outputs.ready == 'true'
        with:
          fetch-depth: 1
      # What earlier reviews of this pull request already said, gathered here so Claude needs no GitHub API access
      # of its own to read it (every push starts a fresh review).
      - name: Collect earlier review comments
        if: steps.auth.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "# Earlier inline review comments on this pull request"
            gh api --paginate "repos/$REPO/pulls/$PR/comments" \
              --jq '.[] | "\n## \(.path):\(.line // .original_line) (\(.user.login), \(.created_at))\n\(.body)"'
          } > .claude-earlier-comments.md
      - uses: anthropics/claude-code-action@fccf022fdf80a6c41253d57e99293f208e484626   # v1.0.237
        id: review
        if: steps.auth.outputs.ready == 'true'
        # Its own limit, under the job's 20 minutes: a step that times out fails (the job would be cancelled), so the
        # post step below still runs and can say the review didn't finish.
        timeout-minutes: 17
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Opus for the review: the diffs here touch money math, bank sync and encryption (CLAUDE.md's routing).
          # --max-turns caps the tool calls one review makes; the prompt keeps the summary from being the casualty.
          # Its GitHub access is reading the pull request and leaving inline comments, nothing else. It doesn't post
          # the summary: it returns it as structured output (--json-schema), and the step after this one posts it.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string","description":"The review summary, in Markdown"}},"required":["summary"]}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You're reviewing a pull request to Runway, a self-hosted personal finance app: a Python backend in runway/
            (SQLite or Postgres through SQLAlchemy Core, Alembic migrations) and a Svelte 5 + TypeScript web app in
            frontend/. Read AGENTS.md, CLAUDE.md and SECURITY.md first; they're the repository's rules.

            This may not be the first review of this pull request: every push starts a new one. Before reviewing, read
            what's already there: `gh pr view --comments` (earlier summaries and replies) and the file
            `.claude-earlier-comments.md` in the working directory (every earlier inline comment). Don't comment again on a problem that already has an inline comment, whether or not it's
            fixed; only raise what's new, or a fix that made things worse.

            You have a limited number of tool calls. On a large pull request, look at the riskiest changes first
            (money, bank sync, auth, encryption, migrations) rather than reading everything, and always leave the
            summary below, even if you ran short: say which files you didn't get to.

            Read the pull request (`gh pr view`, `gh pr diff`) and the code around each change, then review it for:
            - Correctness: bugs, broken edge cases, regressions, anything that contradicts the pull request's own description.
            - Money and dates: amounts, signs (what's owed vs what's held), rounding, time zones, business days, the forecast.
            - Security: authentication and OIDC, bank credentials and tokens (Plaid, SimpleFIN), encryption at rest,
              anything that could log or render a secret, injection, missing CSRF protection on state-changing routes.
            - Data: schema changes without an Alembic migration, queries that won't work on both SQLite and Postgres.
            - Tests: behavior that changed without a test, and tests that were skipped, weakened or deleted.
            - The rules in AGENTS.md (style, real typography in user-facing strings, no hard-wrapped PR text).

            Leave an inline comment on each real problem, on the line it's about, saying what's wrong, why it matters
            and what to do instead. Skip taste and nits a linter would catch: a comment should be worth someone's time.
            If you aren't sure something is a bug, say how sure you are rather than stating it as fact.

            Finish by returning the summary as your structured output (don't post it; the workflow does that, replacing
            the previous review's summary). In Markdown: a line or two on what the change
            does, the problems by severity (or that you found none), what's still open from earlier reviews, and anything
            you couldn't check. Don't approve or request changes.

      # Post the summary, or edit the one an earlier review of this pull request left. It's found by a hidden marker
      # rather than "the bot's last comment", since other workflows (the preview's address and password) post as the
      # same bot.
      - name: Post the summary
        if: steps.auth.outputs.ready == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OUTPUT: ${{ steps.review.outputs.structured_output }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=$(jq -r '.summary // empty' <<<"${OUTPUT:-null}")
          if [ -z "$summary" ]; then
            # A review that ran out of turns or time returns nothing. Say so, rather than leave the last push's summary
            # looking current.
            echo "::warning::The review didn't return a summary."
            summary=$(printf '%s\n\n%s' "**Claude review summary**" \
              "The review of $HEAD_SHA didn't finish, so there's no summary for it ([the run]($RUN_URL)). Anything earlier on this pull request is about an older commit.")
          fi
          marker='<!-- claude-review-summary -->'
          printf '%s\n%s\n' "$marker" "$summary" > "$RUNNER_TEMP/summary.md"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$RUNNER_TEMP/summary.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/summary.md"
          fi
