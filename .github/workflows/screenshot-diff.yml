name: Screenshot diff

# Shows which pixels of the committed screenshots (screenshots/) a pull request changed, through fleet's reusable
# workflow (AnthonyPluth/fleet, .github/workflows/screenshot-diff.yml, `fleet screenshot-diff`) at the commit pinned
# below:
#   - report.html, one self-contained page (no network, every image inline) with, for each changed screenshot, the tabs
#     Reference, Actual and Slider and boxes around what changed, uploaded as an artifact that is not zipped;
#   - the sticky comment (found again by its marker): the link to that page, one line of counts and a note;
#   - summary.json (the facts for each file), uploaded the same way, for tools that want them.
# Informational: it never fails a pull request for a diff, and the merge gate ignores it (merge-gate.yml). Nothing is
# committed and no image is hosted anywhere. The artifact's link works only for someone logged in to GitHub with access
# to the repository, so the comment says so.
#
# It runs on every pull request, not only on ones whose files include screenshots/: a push that reverts the last
# screenshot change leaves a pull request with no screenshot in its diff, which a `paths:` filter would never run for,
# and its comment would keep saying there were changes.
#
# `pull_request`, not `pull_request_target`: nothing here needs a write token for a fork (a fork's token is read-only, so
# the comment is skipped there and the artifact is still made). The tool is installed from fleet's checkout at the
# pinned commit and run with `python -I`, so a pull request can't change the tool that reports on it; the images are the
# only pull request content it reads.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: screenshot-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  diff:
    permissions:
      contents: read         # check out the pull request's images
      pull-requests: write   # the comment
    uses: AnthonyPluth/fleet/.github/workflows/screenshot-diff.yml@77f776706ed977c3e5732b036bbf6a821c62d860   # v2.2.1
    with:
      dir: screenshots/
