name: Security scans

# Static analysis, dependency, container, secret and workflow scans, on top of what docker.yml already runs (pip-audit),
# run by fleet's reusable workflow (AnthonyPluth/fleet, .github/workflows/security.yml) at the commit pinned below:
# Semgrep (the registry packs plus Runway's own rules in .semgrep/, after their examples are checked), npm audit for the
# web app, Trivy over the files (always) and over the image, zizmor over the workflows, and OpenSSF Scorecard on pushes
# and scheduled runs. Findings from Semgrep, Trivy, zizmor and Scorecard go to the Security tab (Code scanning), whose
# check runs the merge gate requires; npm audit fails the build itself. CodeQL and Dependabot alerts come from GitHub's
# own settings, not from here. Runs weekly too, because new vulnerabilities are published for code that hasn't changed.
#
# A pull request, and a push to main, runs only the scans its change can affect (the paths below; a change under
# .github/ runs everything); the weekly and manual runs scan everything. The triggers and the concurrency group stay
# here, because a called workflow can't declare them. The job grants what the called jobs ask for (a called job can't
# be given more than its caller has): the SARIF uploads and Scorecard need the write permissions below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  scans:
    permissions:
      contents: read
      pull-requests: read      # the pull request's changed files
      security-events: write   # the SARIF uploads
      actions: read            # Scorecard
      id-token: write          # Scorecard publishes its results
    uses: AnthonyPluth/fleet/.github/workflows/security.yml@281821f17c9a84d59412c33badf5cfdf9cc31d3b   # v1.0.0
    with:
      code-paths: ^(runway|frontend/src|extension|\.semgrep)/
      semgrep-paths: runway run.py frontend/src extension
      web-dirs: frontend
      image-paths: ^(Dockerfile|\.dockerignore|pyproject\.toml|poetry\.lock)$
