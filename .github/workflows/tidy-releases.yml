name: Tidy releases

# Run by hand (Actions → Tidy releases → Run workflow) to take back versions that shouldn't have been released: each
# one's GitHub release, its tag and its image in the GitHub Container Registry, through fleet's reusable workflow
# (AnthonyPluth/fleet, .github/workflows/tidy-releases.yml) at the commit pinned below. It can first point floating image
# tags (:2, :1.0, ...) at other versions, for when a stray release moved them.
#
# Written for 2026-09-30, when main's history was rewritten and the release job cut v1.0.2 to v1.0.11, v2.0.3 and
# v2.0.4 below v2.3.21 (docker.yml now steps from the highest version ever tagged, so that can't happen again).
#
# It never deletes the newest version, nor an image still tagged latest or with a floating tag it wasn't asked to move.
# It waits for a release in progress (it shares docker.yml's group on main). A group holds only one waiting run, and a
# newer one cancels it: before running this, check Actions that no Docker image run is queued on main (this would
# cancel it, and its commits would wait for the next push), and don't push to main while this waits (that cancels it).
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Versions to delete, separated by spaces (v1.0.2 v2.0.4): the release, its tag and its image"
        required: true
      retag:
        description: "Floating image tags to point elsewhere first, as tag=version (2=2.3.21 1.0=1.0.1)"
        required: false
        default: ""
      confirm:
        description: 'Type "delete" to confirm'
        required: true

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: docker-image-refs/heads/main
  cancel-in-progress: false

jobs:
  tidy:
    permissions:
      contents: write          # delete releases and tags
      packages: write          # move image tags and delete image versions
    uses: AnthonyPluth/fleet/.github/workflows/tidy-releases.yml@77f776706ed977c3e5732b036bbf6a821c62d860   # v2.2.1
    with:
      image: runway
      versions: ${{ inputs.versions }}
      retag: ${{ inputs.retag }}
      confirm: ${{ inputs.confirm }}
