name: Docker image

# Every push to main: run the tests, tag the next version (v1.2.3) and publish a GitHub Release for it, build the image
# for Intel/AMD and ARM with that version baked in, publish it to GitHub Container Registry as
# ghcr.io/<owner>/runway:latest, then delete older images so only the latest is kept.
#
# Versions: each push bumps the patch number (v1.0.0 -> v1.0.1). Put "#minor" in a commit message (or start it with
# "feat:") for v1.1.0, and "#major" (or "BREAKING CHANGE") for v2.0.0.
# Pull requests (including Dependabot's) only run the tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true   # a newer push replaces a build that's still running

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -v tests

  version:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the tag and create the release
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # full history and tags, to find the last version

      - name: Work out the next version
        id: next
        run: |
          # Re-running a build for a commit that's already tagged reuses its version.
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$existing" ]; then
            echo "version=$existing" >> "$GITHUB_OUTPUT"; echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Already tagged $existing"; exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            log=$(git log --format='%s%n%b' "$last"..HEAD)
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -qE '#major|BREAKING CHANGE' <<< "$log"; then
              next="v$((major + 1)).0.0"
            elif grep -qE '#minor|^feat(\(.*\))?:' <<< "$log"; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"; echo "new=true" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (last: ${last:-none})"

      - name: Tag and publish the release
        if: steps.next.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "Runway $VERSION" --generate-notes --verify-tag

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # publish to ghcr.io and delete old versions
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runway" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete older image versions (keep only latest)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: runway
          delete-untagged: true      # understands multi-architecture images, so latest stays intact
          token: ${{ secrets.GITHUB_TOKEN }}
