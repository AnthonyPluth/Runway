name: Docker image

# Every push to main: run the tests (on SQLite and Postgres), tag the next version (v1.2.3) and publish a GitHub Release for it, build the image
# for Intel/AMD and ARM with that version baked in, and publish it to GitHub Container Registry as
# ghcr.io/<owner>/runway:latest plus :1.2.3, :v1.2.3, :1.2 and :1 (so you can pin a version), then delete untagged leftovers.
#
# Versions: each push bumps the patch number (v1.0.0 -> v1.0.1). Put "#minor" in a commit message (or start it with
# "feat:") for v1.1.0, and "#major" (or "BREAKING CHANGE") for v2.0.0.
# Pull requests (including Dependabot's) only run the tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true   # a newer push replaces a build that's still running

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"   # keep the virtualenv in .venv, where it's cached
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:                # used by the postgres run; the sqlite run ignores it
        image: postgres:16
        env:
          POSTGRES_USER: runway
          POSTGRES_PASSWORD: runway
          POSTGRES_DB: runway
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"

      # Poetry and the project's virtualenv are cached between runs; a new Python or poetry.lock starts afresh.
      - name: Cache Poetry
        id: poetry-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/pipx/venvs/poetry
            ~/.local/bin/poetry
          key: poetry-${{ runner.os }}-py${{ steps.python.outputs.python-version }}
      - name: Install Poetry
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        run: pipx install --python "${{ steps.python.outputs.python-path }}" "poetry>=2.0,<3.0"
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ matrix.database }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-root --no-interaction
      - name: Run tests (${{ matrix.database }})
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://runway:runway@localhost:5432/runway' || '' }}
        run: poetry run python -m unittest discover -v tests
      - name: Check dependencies for known vulnerabilities
        if: matrix.database == 'sqlite'
        run: poetry run pip install --quiet pip-audit && poetry run pip-audit

  # Tag the release and build the image in one job, to save starting a second runner.
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the tag and create the release
      packages: write          # publish to ghcr.io and delete old versions
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # full history and tags, to find the last version

      - name: Work out the next version
        id: next
        run: |
          # Re-running a build for a commit that's already tagged reuses its version.
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$existing" ]; then
            echo "version=$existing" >> "$GITHUB_OUTPUT"; echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Already tagged $existing"; exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            log=$(git log --format='%s%n%b' "$last"..HEAD)
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -qE '#major|BREAKING CHANGE' <<< "$log"; then
              next="v$((major + 1)).0.0"
            elif grep -qE '#minor|^feat(\(.*\))?:' <<< "$log"; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"; echo "new=true" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (last: ${last:-none})"

      - name: Tag and publish the release
        if: steps.next.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "Runway $VERSION" --generate-notes --verify-tag

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runway" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (latest, 1.2.3, v1.2.3, 1.2 and 1)
        id: tags
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          v="${VERSION#v}"
          IFS=. read -r major minor patch <<< "$v"
          {
            echo "list<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:$v"
            echo "$IMAGE:v$v"
            echo "$IMAGE:$major.$minor"
            echo "$IMAGE:$major"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ steps.next.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.next.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete untagged leftovers (every released version stays pullable)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: runway
          delete-untagged: true      # understands multi-architecture images, so tagged versions stay intact
          token: ${{ secrets.GITHUB_TOKEN }}
