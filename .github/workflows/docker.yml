name: Docker image

# Every push to main: run the tests (on SQLite and Postgres) and, at the same time, build the image for Intel/AMD and
# ARM with the next version (v1.2.3) baked in. Only once the tests pass is it published to GitHub Container Registry as
# ghcr.io/<owner>/runway:latest plus :1.2.3, :v1.2.3, :1.2 and :1 (so you can pin a version), the version tagged and a
# GitHub Release published for it; then untagged leftovers are deleted.
#
# Versions: each push bumps the patch number (v1.0.0 -> v1.0.1). Put "#minor" in a commit message (or start it with
# "feat:") for v1.1.0, and "#major" (or "BREAKING CHANGE") for v2.0.0.
# Pull requests (including Dependabot's) only run the tests. Only main is ever released: a manual run from another
# branch just runs the tests, and re-running an old build never moves :latest back to it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  # A newer push replaces a pull request's run that's still going. On main a release is never cut off halfway;
  # the next run waits for it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# bash, which runs each step with -eo pipefail: a command that fails inside a pipeline fails the step (without it, only
# the last command in a pipeline counts, and a failed gh or curl passes silently).
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"   # keep the virtualenv in .venv, where it's cached
    strategy:
      matrix:
        python: ["3.14"]       # the only Python Runway supports: what the image runs (see the Dockerfile)
        database: [sqlite, postgres]
    services:
      postgres:                # used by the postgres run; the sqlite run ignores it
        image: postgres:16
        env:
          POSTGRES_USER: runway
          POSTGRES_PASSWORD: runway
          POSTGRES_DB: runway
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}

      # Poetry and the project's virtualenv are cached between runs; a new Python or poetry.lock starts afresh.
      - name: Cache Poetry
        id: poetry-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            ~/.local/pipx/venvs/poetry
            ~/.local/bin/poetry
          key: poetry-2.5.1-${{ runner.os }}-py${{ steps.python.outputs.python-version }}
      - name: Install Poetry
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        run: pipx install --python "${{ steps.python.outputs.python-path }}" "poetry==2.5.1"
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ matrix.database }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-root --no-interaction
      - name: Run tests (postgres)
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql://runway:runway@localhost:5432/runway
        run: |
          poetry run pip install --quiet "unittest-parallel==1.8.6"
          poetry run unittest-parallel -t . -s tests -j 4
      # The SQLite run also measures how much of Runway the tests run: the table goes in the run's summary, and the
      # report goes to Codecov (the README's backend badge).
      - name: Run tests (sqlite) and measure coverage
        if: matrix.database == 'sqlite'
        run: |
          poetry run pip install --quiet "coverage==7.16.2" "unittest-parallel==1.8.6"
          poetry run unittest-parallel -t . -s tests -j 4 --coverage --coverage-rcfile pyproject.toml
          poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage xml -q -o coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.database == 'sqlite'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
        with:
          files: coverage.xml
          flags: backend
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false   # a Codecov outage never holds up a release
      - name: Check dependencies for known vulnerabilities
        if: matrix.database == 'sqlite'
        run: poetry run pip install --quiet "pip-audit==2.10.1" && poetry run pip-audit
      - name: Lint (Python with ruff)
        if: matrix.database == 'sqlite'
        run: |
          pipx run "ruff==0.16.9" check .
      # Type-check (settings in pyproject.toml). mypy runs in the Poetry environment so it sees Runway's dependencies.
      - name: Type-check (Python with mypy)
        if: matrix.database == 'sqlite'
        run: |
          poetry run pip install --quiet "mypy==2.3.1" "types-python-dateutil==2.9.0.20260807"
          poetry run mypy

  # The web app (frontend/): type-check and lint it (the lint covers the extension too), run its unit tests with
  # coverage, and build it (reporting its bundle sizes to Codecov).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Lint (ESLint, also over extension/ and runway/static/)
        run: npm run lint
      - name: Unit tests (Vitest), measuring coverage
        run: npm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Build (and send its bundle sizes to Codecov)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npm run build

  # The image is built while the tests run, and published only once they (and the web app's checks) pass.
  # build: works out the version, builds the image for this runner and checks it starts, then builds it for Intel/AMD
  # and ARM into the build cache. It has no permission to publish anything; the only thing it sends out is the web app's
  # source maps, to Sentry (with a SENTRY_AUTH_TOKEN secret; see the Dockerfile).
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      new: ${{ steps.next.outputs.new }}
      newest: ${{ steps.next.outputs.newest }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0       # full history and tags, to find the last version
          persist-credentials: false

      - name: Work out the next version
        id: next
        run: |
          # Only the newest commit on main moves :latest (and :1.2, :1); re-running an older build doesn't.
          git fetch --quiet origin main
          head=$(git rev-parse FETCH_HEAD)
          newest=false
          if [ "$head" = "$GITHUB_SHA" ]; then newest=true; fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          # Re-running a build for a commit that's already tagged reuses its version.
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$existing" ]; then
            echo "version=$existing" >> "$GITHUB_OUTPUT"; echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Already tagged $existing"; exit 0
          fi
          if [ "$newest" != true ]; then
            echo "::notice::$GITHUB_SHA isn't the newest commit on main any more, so it isn't released."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # How big a step this is comes from the commits since the last version released from this commit's own
          # history. Where it steps from is the highest version ever tagged, so versions only go up, even when main's
          # history is rewritten and its older tags aren't in it (after the rewrite of 2026-09-30, this step went back
          # from v2.3.21 to v1.0.2).
          last=$(git describe --tags --abbrev=0 --first-parent --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
          highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$highest" ]; then
            next=v1.0.0
          else
            if [ -n "$last" ]; then log=$(git log --format='%s%n%b' "$last"..HEAD); else log=$(git log --format='%s%n%b' HEAD); fi
            IFS=. read -r major minor patch <<< "${highest#v}"
            # Pull request titles say what a change is (they're in each merge commit's message): "feat: ..." is a
            # new feature (a minor version), "fix: ..." or anything else a patch, and a "!" before the colon
            # ("feat!: ...") something that breaks an existing setup (a major version).
            # A marker counts only where a line starts with it (or ends with #major / #minor), so a commit message
            # that merely talks about them (like this comment) doesn't release a version.
            if grep -qE '(^|[[:space:]])#major[[:space:]]*$|^BREAKING CHANGE:|^[a-z]+(\(.*\))?!:' <<< "$log"; then
              next="v$((major + 1)).0.0"
            elif grep -qE '(^|[[:space:]])#minor[[:space:]]*$|^feat(\(.*\))?:' <<< "$log"; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          # Never reuse a version that's already tagged elsewhere (say, by an older release from another branch).
          while git rev-parse -q --verify "refs/tags/$next" >/dev/null; do
            IFS=. read -r major minor patch <<< "${next#v}"; next="v${major}.${minor}.$((patch + 1))"
          done
          echo "version=$next" >> "$GITHUB_OUTPUT"; echo "new=true" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (last in this history: ${last:-none}; highest: ${highest:-none})"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
        if: steps.next.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
        if: steps.next.outputs.skip != 'true'

      # Start the image and ask it /healthz.
      - name: Build for this runner
        if: steps.next.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          load: true
          tags: runway:smoke
          build-args: |
            VERSION=${{ steps.next.outputs.version }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_BROWSER_PROJECT=${{ vars.SENTRY_BROWSER_PROJECT || 'runway-web' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
      - name: Check the image starts
        if: steps.next.outputs.skip != 'true'
        run: |
          docker run -d --name smoke -p 8765:8765 -e RUNWAY_ALLOW_NO_AUTH=1 -e RUNWAY_NO_SYNC=1 runway:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz; then docker rm -f smoke; exit 0; fi
            sleep 1
          done
          docker logs smoke; exit 1

      # The slow part (ARM is built under emulation), done now: into the build cache only, which publish reads back.
      - name: Build for Intel/AMD and ARM (not pushed)
        if: steps.next.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.next.outputs.version }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_BROWSER_PROJECT=${{ vars.SENTRY_BROWSER_PROJECT || 'runway-web' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # publish: once the tests, the web app's checks and the build have all passed, push the image (from the build's
  # cache, so it isn't built again) and then tag the release. The tag and Release come last, so a failed or cancelled
  # push never leaves a version with no image.
  publish:
    needs: [test, web, build]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the tag and the release
      packages: write          # publish to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0       # the commits since the last release, for Sentry's release (below)
          persist-credentials: false

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runway" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (latest, 1.2.3, v1.2.3, 1.2 and 1)
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NEWEST: ${{ needs.build.outputs.newest }}
        run: |
          v="${VERSION#v}"
          IFS=. read -r major minor patch <<< "$v"
          {
            echo "list<<EOF"
            echo "$IMAGE:$v"
            echo "$IMAGE:v$v"
            if [ "$NEWEST" = true ]; then
              echo "$IMAGE:latest"
              echo "$IMAGE:$major.$minor"
              echo "$IMAGE:$major"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push (from the build's cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_BROWSER_PROJECT=${{ vars.SENTRY_BROWSER_PROJECT || 'runway-web' }}
          # The same as the build job's, so a web app rebuilt here (the cache missed) matches the source maps uploaded.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
          cache-from: type=gha

      - name: Tag and publish the release
        if: needs.build.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # --target makes GitHub create the tag v1.2.3 on this commit (through the API, so the checkout needs no
          # credentials); a tag that already exists is used as it is.
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Runway $VERSION" --generate-notes

      # The version as a Sentry release in both projects (the server's and the web app's), with the commits it brings,
      # so an issue shows the release that brought it and its suspect commits. The server and the web app tag what they
      # send with the same version (RUNWAY_VERSION). Needs a SENTRY_AUTH_TOKEN secret and a SENTRY_ORG variable (and
      # SENTRY_PROJECT / SENTRY_BROWSER_PROJECT if the projects aren't runway and runway-web); without them it's
      # skipped, and a Sentry problem never fails the release.
      - name: Sentry release
        if: needs.build.outputs.new == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SERVER_PROJECT: ${{ vars.SENTRY_PROJECT || 'runway' }}
          WEB_PROJECT: ${{ vars.SENTRY_BROWSER_PROJECT || 'runway-web' }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ]; then
            echo "No SENTRY_AUTH_TOKEN secret or SENTRY_ORG variable, so no Sentry release."; exit 0
          fi
          cli() { npx --yes @sentry/cli@2.58.6 "$@"; }
          cli releases new "$VERSION" -p "$SERVER_PROJECT" -p "$WEB_PROJECT"
          # Commits through Sentry's GitHub integration if it's set up, else from this checkout's history.
          cli releases set-commits "$VERSION" --auto --ignore-missing || cli releases set-commits "$VERSION" --local --ignore-missing
          cli releases finalize "$VERSION"

  # A third-party action, so it runs on its own with only the permission it needs (no access to the repository).
  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write          # delete old versions from ghcr.io
    steps:
      - name: Delete untagged leftovers (every released version stays pullable)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f   # v1.2.2
        with:
          package: runway
          delete-untagged: true      # understands multi-architecture images, so tagged versions stay intact
          token: ${{ secrets.GITHUB_TOKEN }}
