name: Merge gate

# One commit status, "Merge gate", on each pull request's head, decided by fleet's reusable workflow and its
# .github/scripts/merge-gate.sh at the commit pinned below: passing once the newest run of every workflow the pull
# request started has succeeded (and the required ones ran at all), every other app's check run and every commit status
# has passed (and the required statuses are set), and no review thread with a P1 or P2 badge from Codex is still open;
# pending while anything is still running; failing otherwise. Require it in a ruleset on main (Settings → Rules →
# Rulesets → Require status checks to pass → "Merge gate") and it's the one check a merge waits on. It also merges
# Dependabot's pull requests once it passes, fleet pin bumps included (`automerge-fleet-bumps: true` below, the owner's
# decision in #590); the `chore: fleet content` pull request that fleet-sync.yml opens after a bump is still merged by
# the owner by hand. fleet's defaults are the owner's review policy: the Claude review's first pass is off, so the gate
# requires the "Second review" status alone (fleet's default `required-statuses`), and Codex reviews every pull request.
# `require-codex-review: true` below also keeps the gate pending until Codex has reviewed the head commit
# (merge-gate-threads.yml runs the gate again when Codex's comment arrives).
#
# The triggers, the job's condition and the concurrency group stay here, because a called workflow can't declare them.
# It runs from main's copy with a write token and never checks out or runs a pull request's code: it only reads the pull
# request's checks and threads through the API. So it works for pull requests from forks too.
# workflow_run is safe here: the job runs fleet's script from fleet's checkout, never the pull request's code, and hands
# the event's values to it as inputs.
on:  # zizmor: ignore[dangerous-triggers]
  # Each of the pull request's own workflows finishing (the last one to finish decides).
  workflow_run:
    workflows: [Docker image, Security scans, Docs, Verify flows]
    types: [completed]
  # Other apps' checks finishing (CodeQL, Semgrep, Trivy, zizmor, Codecov); GitHub doesn't send this for Actions' own.
  check_suite:
    types: [completed]
  # By hand, to decide a pull request again; agent-review.yml starts it this way once it has set its status.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions: {}

# The newest evaluation of a commit wins: an older one still running would only report older news.
concurrency:
  group: merge-gate-${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha || inputs.pr }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    # Pull requests only (main's own runs and scheduled scans have none).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_suite' && github.event.check_suite.app.slug != 'github-actions')
    permissions:
      contents: write          # merge Dependabot's pull requests
      pull-requests: write     # merge them, and read their commits, files and review threads
      statuses: write          # the "Merge gate" status
      actions: write           # read the pull request's workflow runs, and start main's release after a merge
      checks: read             # other apps' check runs
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate.yml@77f776706ed977c3e5732b036bbf6a821c62d860   # v2.2.1
    with:
      sha: ${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
      pr: ${{ inputs.pr }}
      # The workflows that must have run (CodeQL isn't asked of Dependabot's pull requests, whose default setup skips
      # it) and the ones that never count (a preview deployment runs for an hour; the screenshot diff is a comment, never
      # a verdict). The required statuses are fleet's default, "Second review" (none on Dependabot's pull requests).
      required-workflows: |
        Docker image
        Security scans
        CodeQL
      # fleet's merge-gate.sh always ignores "Merge gate" and "Cancel runs on close" too, so they aren't listed here.
      ignored-workflows: Preview|Screenshot diff
      # A passing gate needs Codex's review of the head commit, not only no open P1 or P2 thread: without it a pull
      # request Codex hadn't reviewed yet could pass. Dependabot's pull requests are exempt (fleet's merge-gate.sh). To
      # switch the first review back on, pass agent-review.yml `first-review: true` and list "Agent review" and "Second
      # review" here as `required-statuses`.
      require-codex-review: true
      # Dependabot's fleet pin bumps (the `fleet` group in .github/dependabot.yml) merge like its other pull requests
      # once the gate passes (the owner's decision, #590), under the same conditions: every required workflow, check run
      # and status green, no open Codex P1/P2 thread, every commit Dependabot's own and verified, the same repository
      # and not a draft (Dependabot's pull requests get no Second review, as before). A merge made with the gate's token
      # starts no `push` workflow, so after it the gate starts fleet's defaults (docker.yml, security.yml) and
      # fleet-sync.yml, which opens the `chore: fleet content` pull request; the owner merges that one by hand.
      automerge-fleet-bumps: true
      after-merge-workflows: docker.yml security.yml fleet-sync.yml
