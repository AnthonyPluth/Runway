# Runway's own Semgrep rules: the paved paths that earlier clean-ups left, so a copy of the old pattern fails CI
# instead of coming back. `make semgrep` runs them (`make lint` and `make check` include it), and so does the Semgrep
# job in .github/workflows/security.yml. Each rule has a passing and a failing example in .semgrep/tests/
# (`make semgrep-test`).
#
# Fix a finding by using the paved path. Where a use is right for a reason, put `# nosemgrep: <rule id>` on the line,
# with the reason beside it.
rules:
  - id: runway-raw-urlopen
    message: >-
      Make outbound HTTP calls through runway/tls.py's urlopen (certificate checks, https only, no stray redirects),
      not urllib.request's urlopen or build_opener.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: urllib.request.urlopen(...)
      - pattern: urllib.request.build_opener(...)
    paths:
      include: ["/runway/", "/run.py"]
      exclude: ["/runway/tls.py"]

  - id: runway-unvalidated-body
    message: >-
      Read a request body's fields through runway/validate.py (it rejects what isn't the right type with a message
      the user sees), not bool(), float() or int() on the raw value.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $F(body)
          - pattern: $F(body[...])
          - pattern: $F(body.get(...))
          - pattern: $F((body or ...)[...])
          - pattern: $F((body or ...).get(...))
      - metavariable-regex:
          metavariable: $F
          regex: ^(bool|float|int)$
    paths:
      include: ["/runway/server/api/"]

  - id: runway-sql-from-string
    message: >-
      Don't build SQL from strings (an f-string, +, % or .format): use SQLAlchemy's expressions, or bind
      parameters with sa.text(":name").
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: sqlalchemy.text(f"...")
      - pattern: sqlalchemy.text($A + $B)
      - pattern: sqlalchemy.text("..." % ...)
      - pattern: sqlalchemy.text("...".format(...))
      - pattern: text(f"...")
      - pattern: text($A + $B)
      - pattern: text("..." % ...)
      - pattern: text("...".format(...))
      - pattern: $C.exec_driver_sql(f"...")
      - pattern: $C.exec_driver_sql($A + $B)
      - pattern: $C.exec_driver_sql("..." % ...)
      - pattern: $C.exec_driver_sql("...".format(...))
      - pattern: $C.execute(f"...")
      - pattern: $C.execute("..." % ...)
      - pattern: $C.execute("...".format(...))
    paths:
      include: ["/runway/", "/run.py"]

  - id: runway-half-cent-literal
    message: >-
      A half cent is money.CENT (money.is_zero and money.same_amount compare to it), not a 0.005 of its own.
    severity: ERROR
    languages: [python]
    pattern: "0.005"
    options:
      constant_propagation: false   # else a name set to 0.005 (a 0.5% ratio, say) is found at each use too
    paths:
      include: ["/runway/", "/run.py"]
      exclude: ["/runway/money.py", "/runway/migrations/"]

  - id: runway-today-in-sync
    message: >-
      Sync and provider code takes the `today` it's given (so a test, and the daily sync's local day, decide it)
      instead of reading the clock with date.today() (`today or date.today()` as a default is fine).
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: date.today()
          - pattern: datetime.date.today()
      # `today = today or date.today()`: the default for a caller that doesn't pass one.
      - pattern-not-inside: $T or date.today()
    paths:
      include:
        - "/runway/server/sync.py"
        - "/runway/plaid.py"
        - "/runway/plaidapi.py"
        - "/runway/plaidbank.py"
        - "/runway/simplefin.py"
        - "/runway/sfinvest.py"
        - "/runway/finnhub.py"
        - "/runway/prices.py"
        - "/runway/realie.py"
        - "/runway/carta.py"
        - "/runway/carta_web.py"

  - id: runway-utcnow
    message: >-
      datetime.utcnow() is deprecated and gives a naive time that reads as local. "Today" is the machine's local
      time (TZ); anything sent to another system carries its zone (datetime.now(timezone.utc)).
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: datetime.utcnow()
      - pattern: datetime.datetime.utcnow()
    paths:
      include: ["/runway/", "/run.py"]

  - id: runway-month-arithmetic
    message: >-
      Month arithmetic (adding months, a month's length, months between) goes through runway/dates.py, which
      clamps a day the month doesn't have; add the helper there if it's missing.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: dateutil.relativedelta.relativedelta(..., months=$N, ...)
      - pattern: dateutil.relativedelta.relativedelta(..., years=$N, ...)
      - pattern: relativedelta(..., months=$N, ...)
      - pattern: relativedelta(..., years=$N, ...)
      - pattern: calendar.monthrange(...)
      - pattern: $D.year * 12
      - pattern: ($A.year - $B.year) * 12
      - pattern: $D.month + $N
      - pattern: $D.month - $N
    paths:
      include: ["/runway/", "/run.py"]
      exclude: ["/runway/dates.py", "/runway/migrations/"]
