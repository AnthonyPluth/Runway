# Start:   docker compose up -d          (update later: docker compose pull && docker compose up -d)
# Open:    the RUNWAY_PUBLIC_URL you set in .env, and sign in with your identity provider.
services:
  runway:
    image: ghcr.io/anthonypluth/runway:latest   # or pin a version: :1.2.3, :1.2 or :1 (see Releases on GitHub)
    # build: .                                  # or build it yourself from this folder instead
    container_name: runway
    restart: unless-stopped
    ports:
      - "8765:8765"      # behind a reverse proxy on this machine, use "127.0.0.1:8765:8765" so only the proxy can reach it
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]      # Runway needs no special privileges
    volumes:
      - ./data:/data                                   # your database: back this folder up
    environment:
      TZ: ${TZ:-America/Chicago}                       # decides "today" for forecasts and budgets
      RUNWAY_PUBLIC_URL: ${RUNWAY_PUBLIC_URL:?Set RUNWAY_PUBLIC_URL in .env}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_TRUST_UNVERIFIED_EMAIL: ${OIDC_TRUST_UNVERIFIED_EMAIL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      RUNWAY_ALLOWED_HOSTS: ${RUNWAY_ALLOWED_HOSTS:-}
      RUNWAY_SECRET_KEY: ${RUNWAY_SECRET_KEY:-}             # encrypts saved bank access and API keys
      # Optional: reports to Sentry (see DOCKER.md). Off unless SENTRY_DSN is set; then all of it, each off with 0.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_BROWSER_DSN: ${SENTRY_BROWSER_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_PROFILE_SESSION_SAMPLE_RATE: ${SENTRY_PROFILE_SESSION_SAMPLE_RATE:-}
      SENTRY_REPLAY_SAMPLE_RATE: ${SENTRY_REPLAY_SAMPLE_RATE:-}
      SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE: ${SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE:-}
      SENTRY_LOGS: ${SENTRY_LOGS:-}
      SENTRY_METRICS: ${SENTRY_METRICS:-}
      SENTRY_CRONS: ${SENTRY_CRONS:-}
      SENTRY_FEEDBACK: ${SENTRY_FEEDBACK:-}
      SENTRY_AI_CONTENT: ${SENTRY_AI_CONTENT:-}
      # Optional: use Postgres instead of the built-in database (see DOCKER.md for moving your data over).
      DATABASE_URL: ${DATABASE_URL:-}
    # depends_on: [db]            # if you use the Postgres service below

  # Optional Postgres, if you don't already run one. Then set in .env:
  #   DATABASE_URL=postgresql://runway:<password>@db:5432/runway
  # db:
  #   image: postgres:16
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: runway
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  #     POSTGRES_DB: runway
  #   volumes:
  #     - ./postgres:/var/lib/postgresql/data
