# What fleet's session-start hook (.claude/hooks/fleet-session-start.sh, vendored by `tools/fleet sync`, edited in fleet)
# sets up for a cloud session of this repository: Python 3.14 for Poetry's environment, the web app's packages,
# libfaketime for make verify, and the check that frontend/node_modules is complete (a node_modules restored from the
# container's cache can be cut short: ESLint then fails to start and svelte-check can't find esrap's types, so the
# directory is reinstalled from the lockfile when either is missing).
PYTHON_VERSION=3.14
FRONTEND_DIRS="frontend"
APT_PACKAGES="libfaketime"
NODE_CHECK="esrap/types/public.d.ts eslint-plugin-svelte"
